aid: walgreens-boots-alliance
name: Walgreens Boots Alliance
description: >-
  Walgreens Boots Alliance (WBA) is a global pharmacy-led health and wellbeing enterprise
  operating in more than 25 countries, with pharmacy chains Walgreens in the US and Boots
  in the UK, pharmaceutical wholesale and distribution through Alliance Healthcare, and
  specialty pharmacy operations. WBA operates as a Fortune 100 company and global
  healthcare platform, leveraging data science, AI, and digital health technologies to
  serve patients, customers, and health systems. While WBA's primary developer APIs are
  offered through the Walgreens Developer Program, the enterprise also uses healthcare
  data platforms for population health management, specialty pharmacy integration, and
  digital health services.
