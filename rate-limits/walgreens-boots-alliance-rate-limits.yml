description: Walgreens Boots Alliance does not operate a corporate developer
  portal and therefore publishes no rate-limit policy of its own. Partner
  rate limits, when applicable, are governed by the operating-company
  integration agreement (Walgreens Developer Program, Boots), not by a
  WBA-level API gateway.
sources:
  - https://www.walgreensbootsalliance.com/
  - https://corporate.walgreens.com/
notes: No WBA-level API surface or rate-limit policy. See the Walgreens
  rate-limits artifact for the US operating-company throttling posture.
limits:
  - name: WBA Partnership Integrations
    scope: contract
    metric: varies
    limit: see operating-company integration agreement
    notes: Per-partnership limits are negotiated and communicated as part of
      the bilateral integration agreement.
policies:
  - name: Operating-Company Routing
    description: Functional API limits are enforced by the operating company's
      developer program (Walgreens, Boots) rather than at a WBA-level gateway.
