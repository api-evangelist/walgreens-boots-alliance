description: Walgreens Boots Alliance (WBA) is a Fortune 100 global pharmacy
  holding company. There is no WBA-branded developer portal or public API
  marketplace; partner integrations flow through the underlying operating
  companies (the Walgreens Developer Program in the US, Boots in the UK) or
  through bilateral B2B contracts with health systems and payers. Trimmed
  scaffold to a single Contact Sales plan because no public, WBA-level API
  pricing exists.
sources:
  - https://www.walgreensbootsalliance.com/
  - https://corporate.walgreens.com/
notes: WBA does not operate a corporate-level developer program. Partner API
  access is via the operating-company developer portals (e.g. Walgreens
  Developer Program) or through bespoke enterprise contracts.
plans:
  - id: walgreens-boots-alliance-contact-sales
    name: Contact Sales
    type: enterprise
    description: WBA-level API and data partnerships are negotiated bilaterally
      with health systems, payers, and consumer-platform partners. Operating-
      company integrations (Walgreens, Boots) flow through their respective
      developer portals.
    entries:
      - label: Partnership Agreement
        name: partnership_agreement
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Bilateral Partnership Terms
      - name: Operating-Company API Routing (Walgreens / Boots)
