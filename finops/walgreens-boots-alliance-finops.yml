description: FinOps view of Walgreens Boots Alliance at the holding-company
  level. WBA does not bill API consumption directly; API-related cost flows
  are reported by the operating subsidiaries (Walgreens, Boots) under their
  respective partnership agreements. This artifact records that mapping
  rather than a direct WBA invoice surface.
sources:
  - https://www.walgreensbootsalliance.com/
  - https://corporate.walgreens.com/
notes: No corporate-level API invoice; FOCUS attribution flows through the
  operating-company billing entity (Walgreen Co., Boots UK Limited).
billingModel:
  pricingCategory: Custom Contract
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Walgreens Boots Alliance Partnerships
  ServiceCategory: Pharmacy / Healthcare Holding Company
