meters:
  - name: partnership_settlement
    description: Negotiated settlement under the bilateral partnership
      agreement, attributed to the relevant operating company.
    unit: varies
    aggregation: sum
    dimensions:
      - operating_company
      - region
principles:
  - name: Visibility
    description: Track partnership-level settlements at the WBA holding
      level; drill into operating-company telemetry (Walgreens, Boots) for
      per-API observability.
  - name: Allocation
    description: Allocate partnership cost / revenue to the operating-company
      P&L (Walgreens vs Boots) based on the contract's settlement entity.
  - name: Optimization
    description: Optimization happens at the operating-company API surface
      (request volume, conversion); WBA-level levers are renegotiation of
      the partnership agreement at renewal.
  - name: Accountability
    description: Corporate development / partnerships at WBA owns the
      bilateral agreement; operating-company finance teams own the
      partnership P&L.
